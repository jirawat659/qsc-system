include:
  - project: "au-inventory/ci-templates"
    ref: "master"
    file: "/.gitlab-ci.yml"

variables:
  # default branch ของ repo นี้คือ "main" ไม่ใช่ "master" ตามค่า default ของ template
  MAIN_BRANCH: "main"

  # ENV_FILE (GitLab CI/CD variable, Type: File, สร้างแยก scope ละ 1 อัน คือ
  # "staging" กับ "production") ต้องเป็น backend/QSC.Api/appsettings.json ฉบับเต็ม
  # (ConnectionStrings/Jwt/Cors/AI/Logging ครบ) เพราะ template จะ copy ทับไฟล์นี้
  # "ทั้งไฟล์" ก่อน build ไม่ใช่ merge แบบ layered config ของ ASP.NET Core
  ENV_FILE_DEST: "backend\\QSC.Api\\appsettings.json"

  # FRONTEND_ENV_FILE เป็น CI/CD variable (Type: File) แยกต่างหากจาก ENV_FILE — template
  # ผูก ENV_FILE/ENV_FILE_DEST ให้อัตโนมัติแค่คู่เดียว ไฟล์ที่สองต้อง copy เองใน
  # BUILD_COMMAND นี้ (รันผ่าน cmd.exe /c จึงใช้ %VAR% แบบ cmd ไม่ใช่ $env: แบบ PowerShell)
  #
  # guard ต้องใช้ "if exist" ไม่ใช่ if not "%VAR%"=="" — ถ้าไม่ได้สร้างตัวแปรนี้ใน
  # environment นั้น (เช่น production ที่เจตนาปล่อยว่างให้ frontend ตรวจ hostname เอง)
  # cmd.exe จะไม่ขยาย %FRONTEND_ENV_FILE% แต่คงตัวอักษรเดิมไว้ เงื่อนไข != "" จึงเป็นจริง
  # แล้ว copy ทำงานด้วย path ที่ไม่มีจริง -> "The system cannot find the file specified."
  # และ && ตัด chain ทำให้ npm run build ไม่ได้รัน (build 5629 และ 5995 พังแบบนี้)
  BUILD_COMMAND: >
    dotnet publish backend\QSC.Api\QSC.Api.csproj -c Release -r win-x64 --self-contained false -p:SatelliteResourceLanguages=en -o publish\backend &&
    (if exist "%FRONTEND_ENV_FILE%" (copy /Y "%FRONTEND_ENV_FILE%" frontend\.env) else (echo no FRONTEND_ENV_FILE for this environment - frontend will auto-detect hostname)) &&
    cd frontend && npm install --no-audit --no-fund && npm run build && cd .. &&
    xcopy frontend\dist publish\frontend /E /I /Y /Q

  ARTIFACT_PATHS: "publish"

  # /E (ไม่ใช่ /MIR): ห้ามลบไฟล์ปลายทางที่ไม่ได้มากับ publish output
  # สำคัญมากฝั่ง backend — wwwroot/uploads (ลายเซ็น, รูปตรวจ, รูป CAP) เก็บอยู่ที่
  # ปลายทางจริงเท่านั้น ไม่ได้อยู่ใน build ทุกครั้งเลย ถ้าใช้ /MIR รูปที่ user
  # อัปโหลดไว้จะถูกลบทิ้งทุกครั้งที่ deploy
  # Stop-WebAppPool เป็น async — ของเดิม sleep 3 วิ ตายตัวแล้วรอ robocopy ทับ DLL ต่อเลย
  # ถ้า worker process (w3wp.exe) ยัง shutdown ไม่เสร็จ (เช่นมี request/connection ค้าง)
  # จะโดน ERROR 32 "process cannot access the file" — เลยเปลี่ยนเป็น poll AppPoolState
  # จนกว่าจะ Stopped จริง (สูงสุด 30 วิ) แล้ว fallback force-kill w3wp ของ pool นี้ถ้ายังไม่ตาย
  DEPLOY_COMMAND_STAGING: >
    powershell -Command "
    Import-Module WebAdministration;
    Stop-WebAppPool 'qsc-apppool' -ErrorAction SilentlyContinue;
    for ($$i = 0; $$i -lt 30; $$i++) { if ((Get-WebAppPoolState -Name 'qsc-apppool').Value -eq 'Stopped') { break }; Start-Sleep -Seconds 1 };
    Get-Process -Name w3wp -ErrorAction SilentlyContinue | ForEach-Object { $$cmd = (Get-CimInstance Win32_Process -Filter ('ProcessId=' + $$_.Id)).CommandLine; if ($$cmd -match 'qsc-apppool') { Stop-Process -Id $$_.Id -Force -ErrorAction SilentlyContinue } };
    Start-Sleep -Seconds 2;
    robocopy publish\backend 'E:\Website\QSC Service\backend' /E /R:3 /W:5;
    if ($$LASTEXITCODE -ge 8) { Start-WebAppPool 'qsc-apppool'; exit $$LASTEXITCODE };
    Start-WebAppPool 'qsc-apppool';
    robocopy publish\frontend 'E:\Website\QSC Service\frontend' /E /R:3 /W:5;
    if ($$LASTEXITCODE -ge 8) { exit $$LASTEXITCODE };
    exit 0
    "

  DEPLOY_COMMAND_PRODUCTION: >
    powershell -Command "
    Import-Module WebAdministration;
    Stop-WebAppPool 'qsc-apppool' -ErrorAction SilentlyContinue;
    for ($$i = 0; $$i -lt 30; $$i++) { if ((Get-WebAppPoolState -Name 'qsc-apppool').Value -eq 'Stopped') { break }; Start-Sleep -Seconds 1 };
    Get-Process -Name w3wp -ErrorAction SilentlyContinue | ForEach-Object { $$cmd = (Get-CimInstance Win32_Process -Filter ('ProcessId=' + $$_.Id)).CommandLine; if ($$cmd -match 'qsc-apppool') { Stop-Process -Id $$_.Id -Force -ErrorAction SilentlyContinue } };
    Start-Sleep -Seconds 2;
    robocopy publish\backend 'G:\Website\QSC Service\backend' /E /R:3 /W:5;
    if ($$LASTEXITCODE -ge 8) { Start-WebAppPool 'qsc-apppool'; exit $$LASTEXITCODE };
    Start-WebAppPool 'qsc-apppool';
    robocopy publish\frontend 'G:\Website\QSC Service\frontend' /E /R:3 /W:5;
    if ($$LASTEXITCODE -ge 8) { exit $$LASTEXITCODE };
    exit 0
    "

# Tag string ต้องตรงกับ runner ที่ลงทะเบียนจริงเป๊ะ (รวม typo "stagging")
# ยืนยันจาก GitLab API แล้วว่ามี runner online ติด tag นี้จริงทั้งคู่
build:
  tags: ["stagging 2.19"]

deploy_staging:
  tags: ["stagging 2.19"]

deploy_production:
  tags: ["prod 20.5"]
